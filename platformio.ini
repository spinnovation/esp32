[platformio]
default_envs = esp32s3_4848s040

[env:esp32s3_4848s040]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3 PSRAM and Flash Configuration (16MB Flash, 8MB OPI PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DCONFIG_SPIRAM_TYPE_ESPPSRAM64=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps = 
    lvgl/lvgl @ ^8.3.11
    moononournation/Arduino_GFX_Library @ ^1.4.0
    tamctec/TAMC_GT911 @ ^1.0.2
    tarabis/NTPClient @ ^3.2.0
